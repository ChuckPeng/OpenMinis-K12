name: Android

on:
  push:
    paths-ignore:
      - "server/**"
  pull_request:
    paths-ignore:
      - "server/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Signing keys stay out of git
        run: |
          if git ls-files | grep -Ei '(^|/)[^/]*\.(jks|keystore)$|keystore\.properties'; then
            echo "release signing material must not be committed"
            exit 1
          fi

      - name: Assemble and unit test
        working-directory: src/android
        run: |
          # The public tree has no provider-customization.properties, so the
          # upstream Anthropic wire snapshots cannot run here. M0 gates are
          # covered by K12M0AcceptanceTest. A few upstream tests run as well
          # to catch a broken hook in files they read.
          ./gradlew :app:assembleDebug \
            :app:testGithubDebugUnitTest \
            --tests com.openminis.k12.K12M0AcceptanceTest \
            --tests com.openminis.app.KeepScreenOnOrientationTest \
            --tests com.openminis.app.agent.shell.BashismDetectorTest \
            --stacktrace
