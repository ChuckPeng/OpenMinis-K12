name: Android e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulator 37's qemu binary links libpulse even for a headless boot.
      # ubuntu-latest does not install it, so the process exits before adb
      # ever sees emulator-5554.
      - name: Emulator shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - name: Android SDK packages
        run: |
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          else
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          TOOLS="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$TOOLS" --sdk_root="$SDK" --licenses >/dev/null || true
          "$TOOLS" --sdk_root="$SDK" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug and androidTest APKs
        working-directory: src/android
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --stacktrace

      - name: Build server
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/k12-e2e"
          go build -trimpath -o "$RUNNER_TEMP/k12-e2e/openminis-k12-server" ./cmd/openminis-k12-server

      - name: Emulator pairing test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 3072
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -no-metrics
          script: bash .github/workflows/android-e2e.sh
        env:
          K12_SERVER_BIN: ${{ runner.temp }}/k12-e2e/openminis-k12-server
          K12_API_LEVEL: ${{ matrix.api-level }}

      - name: Upload logcat and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-api-${{ matrix.api-level }}
          path: e2e-artifacts/**
          if-no-files-found: warn
